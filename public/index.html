<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON ETL Studio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface2: #232640;
      --border: #2e3156;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --accent3: #ff6584;
      --text: #e2e8f0;
      --text-muted: #8892a4;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --radius: 10px;
      --font: 'Segoe UI', system-ui, sans-serif;
      --mono: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .badge {
      font-size: 11px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* ── Layout ── */
    main {
      display: grid;
      grid-template-columns: 1fr 300px;
      grid-template-rows: auto 1fr auto;
      gap: 0;
      flex: 1;
      overflow: hidden;
    }

    /* ── Panels ── */
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface2);
      flex-shrink: 0;
    }
    .panel-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-title .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .dot-blue  { background: var(--accent); }
    .dot-green { background: var(--accent2); }
    .dot-red   { background: var(--accent3); }
    .dot-yellow{ background: var(--warning); }

    /* ── App layout grid ── */
    .app-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 280px 1fr;
      gap: 12px;
      padding: 12px;
      overflow: hidden;
      flex: 1;
    }
    .right-sidebar {
      padding: 12px 12px 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .output-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    /* ── Textareas ── */
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      padding: 12px;
      resize: none;
      outline: none;
      width: 100%;
    }
    textarea::placeholder { color: var(--text-muted); }
    .textarea-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Buttons ── */
    btn, button { cursor: pointer; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-success { background: var(--accent2); color: #0f1117; }
    .btn-danger  { background: var(--accent3); color: #fff; }
    .btn-ghost   { background: var(--border); color: var(--text); }
    .btn-run {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      padding: 10px 24px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(108,99,255,0.35);
    }
    .btn-run:hover { opacity: 0.9; box-shadow: 0 4px 28px rgba(108,99,255,0.5); }
    .btn-run:active { transform: scale(0.97); }

    /* ── Steps / Pipeline ── */
    .step-list { display: flex; flex-direction: column; gap: 8px; }
    .step-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .step-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
    }
    .step-card-header:hover { background: rgba(255,255,255,0.03); }
    .step-type-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .badge-flatten   { background: rgba(108,99,255,0.2); color: var(--accent); }
    .badge-mapfields { background: rgba(0,212,170,0.2);  color: var(--accent2); }
    .badge-filter    { background: rgba(245,158,11,0.2); color: var(--warning); }
    .badge-aggregate { background: rgba(255,101,132,0.2);color: var(--accent3); }

    .step-body { padding: 10px 12px; border-top: 1px solid var(--border); }

    /* mapping table */
    .mapping-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .mapping-table th {
      text-align: left; padding: 4px 6px;
      color: var(--text-muted); font-size: 11px;
      border-bottom: 1px solid var(--border);
    }
    .mapping-table td { padding: 4px 4px; }
    .mapping-table input[type=text] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 6px;
      width: 100%;
      outline: none;
    }
    .mapping-table input[type=text]:focus { border-color: var(--accent); }
    .mapping-table select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 11px;
      padding: 3px 4px;
      outline: none;
    }

    /* condition rows */
    .condition-row { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
    .condition-row input, .condition-row select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 6px;
      outline: none;
    }
    .condition-row input:focus, .condition-row select:focus { border-color: var(--accent); }
    .condition-row .field-in { flex: 2; }
    .condition-row .op-in    { flex: 1; }
    .condition-row .val-in   { flex: 2; }

    /* agg rows */
    .agg-row { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
    .agg-row input, .agg-row select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      padding: 3px 6px;
      outline: none;
    }

    /* ── Add step dropdown ── */
    .add-step-wrap { position: relative; display: inline-block; }
    .add-step-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 180px;
      z-index: 100;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .add-step-menu button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 9px 14px;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    .add-step-menu button:hover { background: rgba(255,255,255,0.05); }

    /* ── Logs ── */
    .log-entry {
      font-size: 11px;
      font-family: var(--mono);
      padding: 4px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .log-ok    { color: var(--success); background: rgba(34,197,94,0.08); }
    .log-error { color: var(--error);   background: rgba(239,68,68,0.08); }
    .log-skip  { color: var(--text-muted); }

    /* ── Status bar ── */
    .status-bar {
      grid-column: 1 / -1;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 16px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
    }
    .status-dot.ok { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status-dot.error { background: var(--error); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── Misc ── */
    .small-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 4px; display: block;
    }
    .inline-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 4px 8px;
      outline: none;
    }
    .inline-input:focus { border-color: var(--accent); }
    .flex-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .icon-btn {
      background: transparent; border: none;
      color: var(--text-muted); cursor: pointer;
      padding: 2px 4px; border-radius: 4px;
      font-size: 13px; line-height: 1;
    }
    .icon-btn:hover { color: var(--error); background: rgba(239,68,68,0.1); }
    .hidden { display: none !important; }
    .empty-state {
      text-align: center; color: var(--text-muted);
      font-size: 12px; padding: 20px;
    }
    .fields-chip {
      display: inline-flex;
      align-items: center;
      background: rgba(108,99,255,0.12);
      color: var(--accent);
      border: 1px solid rgba(108,99,255,0.25);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 7px;
      margin: 2px;
      cursor: pointer;
    }
    .fields-chip:hover { background: rgba(108,99,255,0.25); }
    .tab-strip {
      display: flex;
      gap: 1px;
      background: var(--bg);
      border-radius: 6px;
      padding: 2px;
    }
    .tab {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border: none;
      background: transparent;
      font-family: var(--font);
      transition: all 0.15s;
    }
    .tab.active { background: var(--surface2); color: var(--text); }
    hr.divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    JSON ETL Studio
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="badge">v1.0</span>
    <button class="btn btn-ghost" onclick="clearAll()">Clear All</button>
  </div>
</header>

<div style="display:flex;flex:1;overflow:hidden">
  <!-- Main area -->
  <div class="app-grid" style="flex:1">

    <!-- Source JSON -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title"><span class="dot dot-blue"></span>Source JSON</span>
        <div class="flex-row">
          <button class="btn btn-ghost" onclick="loadSourceSample()">Sample</button>
          <label class="btn btn-ghost" style="position:relative;overflow:hidden">
            Upload
            <input type="file" accept=".json" onchange="uploadSource(event)"
                   style="position:absolute;inset:0;opacity:0;cursor:pointer" />
          </label>
          <button class="btn btn-primary" onclick="detectSourceFields()">Detect Fields</button>
        </div>
      </div>
      <div class="textarea-wrap">
        <textarea id="sourceInput" spellcheck="false"
          placeholder='Paste your source JSON here...&#10;&#10;Example:&#10;[&#10;  {"id": 1, "user": {"name": "Alice"}, "amount": 100},&#10;  {"id": 2, "user": {"name": "Bob"}, "amount": 200}&#10;]'
        ></textarea>
      </div>
    </div>

    <!-- Destination Schema -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title"><span class="dot dot-green"></span>Destination Schema</span>
        <div class="flex-row">
          <button class="btn btn-ghost" onclick="loadDestSample()">Sample</button>
          <button class="btn btn-success" onclick="suggestMapping()">Auto-Map</button>
        </div>
      </div>
      <div class="textarea-wrap">
        <textarea id="destInput" spellcheck="false"
          placeholder='Paste destination JSON schema / example...&#10;&#10;The fields here are used as destination keys&#10;when auto-mapping from source.'
        ></textarea>
      </div>
    </div>

    <!-- Output (spans 2 cols, split into result + logs) -->
    <div class="output-row">
      <!-- Output JSON -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title"><span class="dot dot-green"></span>Output</span>
          <div class="flex-row">
            <span id="outputCount" style="font-size:11px;color:var(--text-muted)"></span>
            <button class="btn btn-ghost" onclick="copyOutput()">Copy</button>
            <button class="btn btn-success" onclick="downloadOutput()">Download</button>
          </div>
        </div>
        <div class="textarea-wrap">
          <textarea id="outputArea" spellcheck="false" readonly
            placeholder="Run the pipeline to see output here..."></textarea>
        </div>
      </div>

      <!-- Source Fields + Log -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title"><span class="dot dot-yellow"></span>Info</span>
          <div class="tab-strip">
            <button class="tab active" onclick="switchTab('fields')">Fields</button>
            <button class="tab" onclick="switchTab('logs')">Logs</button>
          </div>
        </div>
        <div id="tab-fields" style="flex:1;overflow-y:auto;padding:10px">
          <p class="empty-state">Detect source fields to see them here.<br>Click a field to copy its path.</p>
          <div id="fieldsWrap" class="hidden"></div>
        </div>
        <div id="tab-logs" class="hidden" style="flex:1;overflow-y:auto;padding:10px">
          <p class="empty-state" id="logEmpty">Run the pipeline to see execution logs.</p>
          <div id="logsWrap"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Right sidebar: Pipeline -->
  <div class="right-sidebar" style="width:320px">

    <!-- Run button -->
    <div style="display:flex;gap:8px">
      <button class="btn-run" style="flex:1" onclick="runPipeline()">▶ Run Pipeline</button>
    </div>

    <!-- Pipeline steps -->
    <div class="panel" style="flex:1">
      <div class="panel-header">
        <span class="panel-title">⚙ Pipeline Steps</span>
        <div class="add-step-wrap">
          <button class="btn btn-primary" onclick="toggleAddMenu()">+ Add Step</button>
          <div class="add-step-menu hidden" id="addStepMenu">
            <button onclick="addStep('mapFields')">🗺 Map / Rename Fields</button>
            <button onclick="addStep('flatten')">📐 Flatten Nested JSON</button>
            <button onclick="addStep('filter')">🔍 Filter Records</button>
            <button onclick="addStep('aggregate')">📊 Aggregate / Group-By</button>
          </div>
        </div>
      </div>
      <div id="stepList" class="step-list" style="padding:10px;overflow-y:auto;flex:1">
        <p class="empty-state">No steps yet.<br>Add a step to build your pipeline.</p>
      </div>
    </div>

    <!-- Pipeline JSON (advanced) -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">📋 Pipeline JSON</span>
        <div class="flex-row">
          <button class="btn btn-ghost" onclick="loadPipelineJSON()">Load</button>
          <button class="btn btn-ghost" onclick="copyPipelineJSON()">Copy</button>
        </div>
      </div>
      <div class="textarea-wrap" style="max-height:160px">
        <textarea id="pipelineJSON" spellcheck="false"
          placeholder="Raw pipeline steps JSON (auto-updated)..."></textarea>
      </div>
    </div>

  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusMsg">Ready</span>
  <span style="margin-left:auto;font-family:var(--mono)">JSON ETL Studio</span>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let steps = [];
let sourceFields = [];

// ── Utilities ──────────────────────────────────────────────────────────────
function setStatus(msg, type = 'idle') {
  document.getElementById('statusMsg').textContent = msg;
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (type === 'ok' ? ' ok' : type === 'error' ? ' error' : '');
}

function parseJSON(str, label) {
  try { return JSON.parse(str); }
  catch (e) { throw new Error(`Invalid JSON in ${label}: ${e.message}`); }
}

function switchTab(name) {
  document.getElementById('tab-fields').classList.toggle('hidden', name !== 'fields');
  document.getElementById('tab-logs').classList.toggle('hidden', name !== 'logs');
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && name === 'fields') || (i === 1 && name === 'logs'));
  });
}

function clearAll() {
  document.getElementById('sourceInput').value = '';
  document.getElementById('destInput').value = '';
  document.getElementById('outputArea').value = '';
  document.getElementById('outputCount').textContent = '';
  steps = [];
  sourceFields = [];
  renderSteps();
  document.getElementById('logsWrap').innerHTML = '';
  document.getElementById('fieldsWrap').innerHTML = '';
  document.getElementById('fieldsWrap').classList.add('hidden');
  setStatus('Cleared');
}

// ── Source ─────────────────────────────────────────────────────────────────
function loadSourceSample() {
  document.getElementById('sourceInput').value = JSON.stringify([
    { id: 1, user: { name: 'Alice', email: 'alice@example.com' }, order: { total: 120.5, items: 3 }, region: 'North' },
    { id: 2, user: { name: 'Bob',   email: 'bob@example.com'   }, order: { total: 89.0,  items: 1 }, region: 'South' },
    { id: 3, user: { name: 'Carol', email: 'carol@example.com' }, order: { total: 340.0, items: 7 }, region: 'North' },
    { id: 4, user: { name: 'Dave',  email: 'dave@example.com'  }, order: { total: 55.0,  items: 2 }, region: 'East'  },
  ], null, 2);
}

function loadDestSample() {
  document.getElementById('destInput').value = JSON.stringify({
    customer_name: '',
    email_address: '',
    total_spent: 0,
    area: ''
  }, null, 2);
}

function uploadSource(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { document.getElementById('sourceInput').value = e.target.result; };
  reader.readAsText(file);
}

async function detectSourceFields() {
  const src = document.getElementById('sourceInput').value.trim();
  if (!src) return setStatus('Paste source JSON first', 'error');
  try {
    const source = parseJSON(src, 'Source');
    const res = await fetch('/api/fields', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    sourceFields = data.fields;
    renderFieldChips(sourceFields);
    setStatus(`Detected ${sourceFields.length} fields`, 'ok');
  } catch (e) { setStatus(e.message, 'error'); }
}

function renderFieldChips(fields) {
  const wrap = document.getElementById('fieldsWrap');
  wrap.innerHTML = '';
  wrap.classList.remove('hidden');
  document.querySelector('#tab-fields .empty-state')?.remove();
  fields.forEach(f => {
    const chip = document.createElement('span');
    chip.className = 'fields-chip';
    chip.textContent = f;
    chip.title = 'Click to copy';
    chip.onclick = () => { navigator.clipboard.writeText(f); chip.style.background = 'rgba(34,197,94,0.2)'; setTimeout(() => chip.style.background = '', 800); };
    wrap.appendChild(chip);
  });
}

// ── Auto-map ───────────────────────────────────────────────────────────────
async function suggestMapping() {
  const srcStr = document.getElementById('sourceInput').value.trim();
  const dstStr = document.getElementById('destInput').value.trim();
  if (!srcStr || !dstStr) return setStatus('Need both Source and Destination JSON', 'error');
  try {
    const source = parseJSON(srcStr, 'Source');
    const dest   = parseJSON(dstStr, 'Destination');

    // Detect source fields
    const fieldsRes = await fetch('/api/fields', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source })
    });
    const { fields: srcFields } = await fieldsRes.json();
    sourceFields = srcFields;
    renderFieldChips(srcFields);

    const destFields = Object.keys(dest);

    const res = await fetch('/api/suggest-mapping', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sourceFields: srcFields, destFields })
    });
    const { mapping } = await res.json();

    // Add or update a mapFields step
    const existing = steps.find(s => s.type === 'mapFields');
    if (existing) {
      existing.mapping = { ...existing.mapping, ...mapping };
    } else {
      steps.push({ type: 'mapFields', mapping });
    }
    renderSteps();
    setStatus(`Auto-mapped ${Object.keys(mapping).length} / ${destFields.length} fields`, 'ok');
  } catch(e) { setStatus(e.message, 'error'); }
}

// ── Pipeline steps ─────────────────────────────────────────────────────────
function toggleAddMenu() {
  document.getElementById('addStepMenu').classList.toggle('hidden');
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.add-step-wrap')) {
    document.getElementById('addStepMenu').classList.add('hidden');
  }
});

function addStep(type) {
  document.getElementById('addStepMenu').classList.add('hidden');
  if (type === 'flatten') {
    steps.push({ type: 'flatten', separator: '.' });
  } else if (type === 'mapFields') {
    steps.push({ type: 'mapFields', mapping: { '': '' } });
  } else if (type === 'filter') {
    steps.push({ type: 'filter', conditions: [{ field: '', op: 'eq', value: '' }] });
  } else if (type === 'aggregate') {
    steps.push({ type: 'aggregate', groupBy: '', aggregations: [{ field: '', op: 'sum', as: '' }] });
  }
  renderSteps();
}

function removeStep(idx) {
  steps.splice(idx, 1);
  renderSteps();
}

function renderSteps() {
  const list = document.getElementById('stepList');
  list.innerHTML = '';
  if (steps.length === 0) {
    list.innerHTML = '<p class="empty-state">No steps yet.<br>Add a step to build your pipeline.</p>';
    syncPipelineJSON();
    return;
  }
  steps.forEach((step, idx) => {
    const card = document.createElement('div');
    card.className = 'step-card';
    card.innerHTML = `
      <div class="step-card-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:var(--text-muted);font-size:11px;font-family:var(--mono)">${idx + 1}</span>
          <span class="step-type-badge badge-${step.type.toLowerCase()}">${step.type}</span>
        </div>
        <div style="display:flex;gap:4px">
          ${idx > 0 ? `<button class="icon-btn" title="Move up" onclick="moveStep(${idx},-1)">↑</button>` : ''}
          ${idx < steps.length - 1 ? `<button class="icon-btn" title="Move down" onclick="moveStep(${idx},1)">↓</button>` : ''}
          <button class="icon-btn" onclick="removeStep(${idx})">✕</button>
        </div>
      </div>
      <div class="step-body" id="stepBody-${idx}"></div>
    `;
    list.appendChild(card);
    renderStepBody(step, idx, card.querySelector(`#stepBody-${idx}`));
  });
  syncPipelineJSON();
}

function moveStep(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= steps.length) return;
  [steps[idx], steps[newIdx]] = [steps[newIdx], steps[idx]];
  renderSteps();
}

function renderStepBody(step, idx, container) {
  if (step.type === 'flatten') {
    container.innerHTML = `
      <label class="small-label">Separator</label>
      <input class="inline-input" value="${step.separator || '.'}"
        oninput="steps[${idx}].separator = this.value; syncPipelineJSON()" style="width:60px" />
    `;

  } else if (step.type === 'mapFields') {
    const entries = Object.entries(step.mapping || {});
    const rows = entries.map(([dest, src], ri) => `
      <tr>
        <td><input type="text" value="${escHtml(dest)}" placeholder="destination key"
          oninput="updateMapping(${idx}, ${ri}, 'dest', this.value)" /></td>
        <td style="text-align:center;color:var(--text-muted);padding:0 4px">←</td>
        <td>
          <input type="text" value="${escHtml(src)}" placeholder="source path or {field}"
            oninput="updateMapping(${idx}, ${ri}, 'src', this.value)"
            list="srcFields-${idx}" />
          <datalist id="srcFields-${idx}">
            ${sourceFields.map(f => `<option value="${f}">`).join('')}
          </datalist>
        </td>
        <td><button class="icon-btn" onclick="removeMappingRow(${idx},${ri})">✕</button></td>
      </tr>`).join('');
    container.innerHTML = `
      <table class="mapping-table">
        <thead><tr><th>Destination</th><th></th><th>Source path</th><th></th></tr></thead>
        <tbody id="mapRows-${idx}">${rows}</tbody>
      </table>
      <button class="btn btn-ghost" style="margin-top:6px;font-size:11px" onclick="addMappingRow(${idx})">+ Row</button>
    `;

  } else if (step.type === 'filter') {
    const conds = step.conditions || [];
    const rows = conds.map((c, ci) => `
      <div class="condition-row">
        <input class="field-in" type="text" value="${escHtml(c.field)}" placeholder="field.path"
          oninput="steps[${idx}].conditions[${ci}].field=this.value;syncPipelineJSON()"
          list="srcFields-f${idx}" />
        <datalist id="srcFields-f${idx}">
          ${sourceFields.map(f => `<option value="${f}">`).join('')}
        </datalist>
        <select class="op-in" onchange="steps[${idx}].conditions[${ci}].op=this.value;syncPipelineJSON()">
          ${['eq','neq','gt','gte','lt','lte','contains','exists','missing'].map(op =>
            `<option value="${op}" ${c.op===op?'selected':''}>${op}</option>`).join('')}
        </select>
        <input class="val-in" type="text" value="${escHtml(String(c.value ?? ''))}" placeholder="value"
          oninput="steps[${idx}].conditions[${ci}].value=this.value;syncPipelineJSON()" />
        <button class="icon-btn" onclick="steps[${idx}].conditions.splice(${ci},1);renderSteps()">✕</button>
      </div>`).join('');
    container.innerHTML = `
      <div id="condRows-${idx}">${rows}</div>
      <button class="btn btn-ghost" style="font-size:11px" onclick="steps[${idx}].conditions.push({field:'',op:'eq',value:''});renderSteps()">+ Condition</button>
    `;

  } else if (step.type === 'aggregate') {
    const aggs = step.aggregations || [];
    const aggRows = aggs.map((a, ai) => `
      <div class="agg-row">
        <input type="text" value="${escHtml(a.field)}" placeholder="field" style="flex:2"
          oninput="steps[${idx}].aggregations[${ai}].field=this.value;syncPipelineJSON()"
          list="srcFields-a${idx}" />
        <datalist id="srcFields-a${idx}">
          ${sourceFields.map(f => `<option value="${f}">`).join('')}
        </datalist>
        <select onchange="steps[${idx}].aggregations[${ai}].op=this.value;syncPipelineJSON()">
          ${['sum','avg','min','max','count'].map(op =>
            `<option value="${op}" ${a.op===op?'selected':''}>${op}</option>`).join('')}
        </select>
        <input type="text" value="${escHtml(a.as || '')}" placeholder="as (output key)" style="flex:2"
          oninput="steps[${idx}].aggregations[${ai}].as=this.value;syncPipelineJSON()" />
        <button class="icon-btn" onclick="steps[${idx}].aggregations.splice(${ai},1);renderSteps()">✕</button>
      </div>`).join('');
    container.innerHTML = `
      <label class="small-label">Group By field</label>
      <input class="inline-input" value="${escHtml(step.groupBy || '')}" placeholder="field path (leave blank for global)"
        oninput="steps[${idx}].groupBy=this.value;syncPipelineJSON()"
        list="srcFields-gb${idx}" style="width:100%;margin-bottom:8px" />
      <datalist id="srcFields-gb${idx}">
        ${sourceFields.map(f => `<option value="${f}">`).join('')}
      </datalist>
      <label class="small-label">Aggregations</label>
      <div id="aggRows-${idx}">${aggRows}</div>
      <button class="btn btn-ghost" style="font-size:11px;margin-top:4px"
        onclick="steps[${idx}].aggregations.push({field:'',op:'sum',as:''});renderSteps()">+ Aggregation</button>
    `;
  }
}

function updateMapping(stepIdx, rowIdx, which, value) {
  const entries = Object.entries(steps[stepIdx].mapping);
  if (which === 'dest') {
    const newMapping = {};
    entries.forEach(([d, s], i) => { newMapping[i === rowIdx ? value : d] = s; });
    steps[stepIdx].mapping = newMapping;
  } else {
    entries[rowIdx][1] = value;
    steps[stepIdx].mapping = Object.fromEntries(entries);
  }
  syncPipelineJSON();
}

function addMappingRow(stepIdx) {
  steps[stepIdx].mapping[''] = '';
  renderSteps();
}

function removeMappingRow(stepIdx, rowIdx) {
  const entries = Object.entries(steps[stepIdx].mapping);
  entries.splice(rowIdx, 1);
  steps[stepIdx].mapping = Object.fromEntries(entries);
  renderSteps();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Pipeline JSON sync ─────────────────────────────────────────────────────
function syncPipelineJSON() {
  document.getElementById('pipelineJSON').value = JSON.stringify(steps, null, 2);
}

function loadPipelineJSON() {
  try {
    steps = JSON.parse(document.getElementById('pipelineJSON').value);
    renderSteps();
    setStatus('Pipeline loaded from JSON', 'ok');
  } catch(e) { setStatus('Invalid pipeline JSON: ' + e.message, 'error'); }
}

function copyPipelineJSON() {
  navigator.clipboard.writeText(document.getElementById('pipelineJSON').value);
  setStatus('Pipeline JSON copied', 'ok');
}

// ── Run ────────────────────────────────────────────────────────────────────
async function runPipeline() {
  const srcStr = document.getElementById('sourceInput').value.trim();
  if (!srcStr) return setStatus('Paste source JSON first', 'error');
  if (steps.length === 0) return setStatus('Add at least one pipeline step', 'error');

  setStatus('Running pipeline…');
  try {
    const source = parseJSON(srcStr, 'Source');
    const res = await fetch('/api/transform', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source, steps })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    const out = JSON.stringify(data.result, null, 2);
    document.getElementById('outputArea').value = out;

    const count = Array.isArray(data.result) ? `${data.result.length} records` : '1 record';
    document.getElementById('outputCount').textContent = count;

    renderLogs(data.logs);
    switchTab('logs');
    setStatus(`Done — ${count}`, 'ok');
  } catch(e) {
    setStatus(e.message, 'error');
  }
}

function renderLogs(logs) {
  const wrap = document.getElementById('logsWrap');
  document.getElementById('logEmpty').classList.add('hidden');
  wrap.innerHTML = logs.map(l => {
    const cls = l.status === 'ok' ? 'log-ok' : l.status === 'error' ? 'log-error' : 'log-skip';
    const icon = l.status === 'ok' ? '✓' : l.status === 'error' ? '✗' : '○';
    const extra = l.recordsOut != null ? ` → ${l.recordsOut} records`
                : l.groups != null ? ` → ${l.groups} groups`
                : l.error ? `: ${l.error}` : '';
    return `<div class="log-entry ${cls}">${icon} <b>${l.step}</b>${extra}</div>`;
  }).join('');
}

// ── Output ─────────────────────────────────────────────────────────────────
function copyOutput() {
  const v = document.getElementById('outputArea').value;
  if (!v) return;
  navigator.clipboard.writeText(v);
  setStatus('Output copied', 'ok');
}

function downloadOutput() {
  const v = document.getElementById('outputArea').value;
  if (!v) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([v], { type: 'application/json' }));
  a.download = 'output.json';
  a.click();
}
</script>
